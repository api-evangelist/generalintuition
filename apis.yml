aid: generalintuition
name: General Intuition
description: >-
  General Intuition is a frontier AI lab, founded in 2025 and spun out of Medal, building
  spatial-temporal world and action models that learn to perceive, anticipate, and act in space
  and time. Rather than training primarily on the archive of human language, its systems learn from
  gameplay data, teaching machines to play, dream within compressed simulacra of reality, and
  improvise within the unfolding dynamics of the world. The company is developing a commercial API
  for gaming, simulation, and robotics partners, with broader access planned through 2026. General
  Intuition is backed by Khosla Ventures, which led both its $133.7M seed round (October 2025) and
  its $320M Series A at a $2.3B valuation (2026).
